[project]
name = "pbz2"
version = "0.2.2a0"
description = "Stream and parallel-process .bz2 files via pbzip2."
authors = [
    {name = "gitronald", email = "gitronald@users.noreply.github.com"}
]
requires-python = ">=3.11"
dependencies = [
    "orjson>=3.11.9",
    "typer",
]
readme = "README.md"
license = "MIT"

[project.urls]
repository = "https://github.com/gitronald/pbz2"

[project.scripts]
pbz2 = "pbz2.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit",
    "pyrefly",
    "pytest>=9.0.2",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
python-version = "3.11"
project-includes = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
